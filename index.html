<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanakirja — Finnish ↔ English ↔ Swedish ↔ German Dictionary</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fafafa; color: #222; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 24px 64px; }
h1 { font-size: 24px; margin-bottom: 2px; }
.sub { color: #666; margin-bottom: 18px; font-size: 13px; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.tab { padding: 8px 16px; background: #eee; border-radius: 6px 6px 0 0; cursor: pointer; user-select: none; font-size: 14px; }
.tab.active { background: #fff; font-weight: 600; box-shadow: 0 -1px 0 0 #e5e5e5 inset; }
.search { width: 100%; padding: 11px 14px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; background: #fff; }
.search:focus { outline: none; border-color: #0070f3; box-shadow: 0 0 0 2px rgba(0,112,243,.18); }
.stats { color: #888; font-size: 13px; margin-bottom: 8px; }
.list { background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; overflow: hidden; }
.list .head:first-child { border-top-left-radius: 6px; border-top-right-radius: 6px; }
.row, .head { display: grid; grid-template-columns: minmax(100px, 1fr) 46px 1.1fr 1.1fr 1.1fr 1.1fr 1.1fr; gap: 7px; padding: 9px 14px; align-items: baseline; }
.row { border-bottom: 1px solid #f0f0f0; }
.head { background: #f4f5f7; border-bottom: 1px solid #e5e5e5; font-size: 12px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: .3px; padding: 7px 14px; }
.head .col { display: flex; align-items: center; gap: 4px; }
.head .em { font-size: 14px; }
.row:last-child { border-bottom: 0; }
.row:hover { background: #fafbff; }
.row.match-exact { background: #fffbe6; box-shadow: inset 3px 0 0 0 #f5c518; }
.row.match-exact:hover { background: #fff7d1; }
.fi { font-weight: 600; }
.en { color: #1d1d1f; }
.sv { color: #1d1d1f; }
.de { color: #1d1d1f; }
.it { color: #1d1d1f; }
.fr { color: #1d1d1f; }
.alt { color: #888; font-size: 13px; }
.flag { font-size: 10px; color: #999; margin-right: 3px; }
.pos { font-size: 11px; background: #eef1f4; color: #555; padding: 2px 7px; border-radius: 999px; text-align: center; font-weight: 500; letter-spacing: .2px; text-transform: uppercase; justify-self: start; }
.empty { padding: 40px; text-align: center; color: #888; }
.loading { padding: 40px; text-align: center; color: #aaa; }
.footer { text-align: center; color: #aaa; font-size: 12px; margin-top: 24px; }
.footer a { color: #888; text-decoration: none; }
.footer a:hover { text-decoration: underline; }
@media (max-width: 600px) {
  .row { grid-template-columns: 1fr 50px; }
  .row .en, .row .fi:nth-child(3), .row .sv, .row .de, .row .it, .row .fr { grid-column: 1 / -1; padding-top: 2px; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sanakirja</h1>
  <div class="sub">Finnish ↔ English ↔ Swedish ↔ German ↔ Italian ↔ French dictionary</div>
  <div class="tabs">
    <div class="tab active" data-tab="fi-en">FI → all</div>
    <div class="tab" data-tab="en-fi">EN → all</div>
    <div class="tab" data-tab="sv-en">SV → EN</div>
    <div class="tab" data-tab="de-en">DE → EN</div>
    <div class="tab" data-tab="it-en">IT → EN</div>
    <div class="tab" data-tab="fr-en">FR → EN</div>
  </div>
  <input class="search" id="q" placeholder="Search…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <div class="stats" id="stats"></div>
  <div class="list" id="list"><div class="loading">Loading dictionary…</div></div>
  <div class="footer">
    <a href="https://github.com/lamp2022/sanakirja">github.com/lamp2022/sanakirja</a>
  </div>
</div>
<script>
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC_MAP[c]);

let fiEn = [], enFi = [], svEn = [], deEn = [], itEn = [], frEn = [];
let enSvMap = {}, enDeMap = {}, enItMap = {}, enFrMap = {};
let current = 'fi-en';

async function load() {
  try {
    const fetches = [
      fetch('data.json').then(r => r.json()),
      fetch('en_fi_data.json').then(r => r.json()),
      fetch('en_sv.json').then(r => r.json()).catch(() => []),
      fetch('sv_en.json').then(r => r.json()).catch(() => []),
      fetch('en_de.json').then(r => r.json()).catch(() => []),
      fetch('de_en.json').then(r => r.json()).catch(() => []),
      fetch('en_it.json').then(r => r.json()).catch(() => []),
      fetch('it_en.json').then(r => r.json()).catch(() => []),
      fetch('en_fr.json').then(r => r.json()).catch(() => []),
      fetch('fr_en.json').then(r => r.json()).catch(() => []),
    ];
    const [a, b, csv, dsv, cde, dde, cit, dit, cfr, dfr] = await Promise.all(fetches);
    fiEn = a; enFi = b; svEn = dsv; deEn = dde; itEn = dit; frEn = dfr;
    for (const e of csv) enSvMap[String(e.en).toLowerCase()] = e.sv;
    for (const e of cde) enDeMap[String(e.en).toLowerCase()] = e.de;
    for (const e of cit) enItMap[String(e.en).toLowerCase()] = e.it;
    for (const e of cfr) enFrMap[String(e.en).toLowerCase()] = e.fr;
    render();
  } catch (e) {
    document.getElementById('list').innerHTML =
      '<div class="empty">Failed to load dictionary data.</div>';
  }
}

function asArr(v) { return Array.isArray(v) ? v : (v == null ? [] : [v]); }

function svFor(enWord) {
  if (!enWord) return '';
  const v = enSvMap[String(enWord).toLowerCase()];
  if (!v) return '';
  return asArr(v).join(', ');
}

function deFor(enWord) {
  if (!enWord) return '';
  const v = enDeMap[String(enWord).toLowerCase()];
  if (!v) return '';
  return asArr(v).join(', ');
}

function itFor(enWord) {
  if (!enWord) return '';
  const v = enItMap[String(enWord).toLowerCase()];
  if (!v) return '';
  return asArr(v).join(', ');
}

function frFor(enWord) {
  if (!enWord) return '';
  const v = enFrMap[String(enWord).toLowerCase()];
  if (!v) return '';
  return asArr(v).join(', ');
}

function render() {
  const q = document.getElementById('q').value.toLowerCase().trim();
  const data = current === 'fi-en' ? fiEn
    : current === 'en-fi' ? enFi
    : current === 'sv-en' ? svEn
    : current === 'de-en' ? deEn
    : current === 'it-en' ? itEn
    : frEn;
  // Score each entry: 0 = exact match, 1 = word-boundary prefix, 2 = prefix anywhere,
  // 3 = substring. Lower is better. Within a tier, shorter primary headword wins.
  function scoreEntry(d, q) {
    const fields = [
      asArr(d.fi).map(s => String(s).toLowerCase()),
      asArr(d.en).map(s => String(s).toLowerCase()),
      asArr(d.sv).map(s => String(s).toLowerCase()),
      asArr(d.de).map(s => String(s).toLowerCase()),
      asArr(d.it).map(s => String(s).toLowerCase()),
      asArr(d.fr).map(s => String(s).toLowerCase()),
    ];
    let best = 99;
    for (const list of fields) {
      for (const v of list) {
        if (!v) continue;
        if (v === q) { best = Math.min(best, 0); continue; }
        if (v.startsWith(q)) { best = Math.min(best, 1); continue; }
        // word-boundary match inside multi-word entry
        if (v.split(/\s+/).some(w => w === q)) { best = Math.min(best, 1); continue; }
        if (v.split(/\s+/).some(w => w.startsWith(q))) { best = Math.min(best, 2); continue; }
        if (v.includes(q)) { best = Math.min(best, 3); }
      }
    }
    return best;
  }

  let filtered, scoreOf;
  if (q) {
    const scored = [];
    for (const d of data) {
      const s = scoreEntry(d, q);
      if (s < 99) scored.push([s, d]);
    }
    scored.sort((a, b) => {
      if (a[0] !== b[0]) return a[0] - b[0];
      const al = (asArr(a[1].fi)[0] || asArr(a[1].en)[0] || asArr(a[1].sv)[0] || '').length;
      const bl = (asArr(b[1].fi)[0] || asArr(b[1].en)[0] || asArr(b[1].sv)[0] || '').length;
      return al - bl;
    });
    filtered = scored.map(x => x[1]);
    const scoreMap = new Map(scored.map(x => [x[1], x[0]]));
    scoreOf = d => scoreMap.get(d);
  } else {
    filtered = data;
    scoreOf = () => -1;
  }

  document.getElementById('stats').textContent =
    filtered.length.toLocaleString() + ' entries' +
    (q ? ' (filtered from ' + data.length.toLocaleString() + ')' : '');

  const list = document.getElementById('list');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">No results.</div>';
    return;
  }
  // Column header row — flag emoji + 2-letter code
  const head = (a, b, c) => `<div class="head">
    <div class="col"><span class="em">${a[0]}</span>${a[1]}</div>
    <div></div>
    <div class="col"><span class="em">${b[0]}</span>${b[1]}</div>
    ${c.map(x => `<div class="col"><span class="em">${x[0]}</span>${x[1]}</div>`).join('')}
  </div>`;
  const FI = ['🇫🇮', 'Suomi'], EN = ['🇬🇧', 'English'], SV = ['🇸🇪', 'Svenska'],
        DE = ['🇩🇪', 'Deutsch'], IT = ['🇮🇹', 'Italiano'], FR = ['🇫🇷', 'Français'];
  let headerHtml = '';
  if (current === 'fi-en') headerHtml = head(FI, EN, [FR, DE, SV, IT]);
  else if (current === 'en-fi') headerHtml = head(EN, FI, [FR, DE, SV, IT]);
  else if (current === 'sv-en') headerHtml = head(SV, EN, [['',''],['',''],['',''],['','']]);
  else if (current === 'de-en') headerHtml = head(DE, EN, [['',''],['',''],['',''],['','']]);
  else if (current === 'it-en') headerHtml = head(IT, EN, [['',''],['',''],['',''],['','']]);
  else headerHtml = head(FR, EN, [['',''],['',''],['',''],['','']]);
  const slice = filtered.slice(0, 500);
  list.innerHTML = headerHtml + slice.map(d => {
    const fi = asArr(d.fi);
    const en = asArr(d.en);
    const pos = esc(d.pos || '');
    const posBadge = pos ? `<span class="pos">${pos}</span>` : '<span></span>';
    function makeCell(cls, val) {
      return val
        ? `<div class="${cls}">${esc(val)}</div>`
        : `<div class="${cls}"></div>`;
    }
    if (current === 'fi-en' || current === 'en-fi') {
      const altEn = en.length > 1
        ? ` <span class="alt">· ${esc(en.slice(1).join(', '))}</span>`
        : '';
      const altFi = fi.length > 1
        ? ` <span class="alt">· ${esc(fi.slice(1).join(', '))}</span>`
        : '';
      const sv = svFor(en[0]);
      const de = deFor(en[0]);
      const it = itFor(en[0]);
      const fr = frFor(en[0]);
      const headLeft = current === 'fi-en'
        ? `<div class="fi">${esc(fi[0] || '')}</div>`
        : `<div class="en">${esc(en[0] || '')}</div>`;
      const otherCell = current === 'fi-en'
        ? `<div class="en">${esc(en[0] || '')}${altEn}</div>`
        : `<div class="fi">${esc(fi[0] || '')}${altFi}</div>`;
      return `<div class="row${scoreOf(d) === 0 ? ' match-exact' : ''}">
        ${headLeft}
        ${posBadge}
        ${otherCell}
        ${makeCell('fr', fr)}
        ${makeCell('de', de)}
        ${makeCell('sv', sv)}
        ${makeCell('it', it)}
      </div>`;
    } else {
      // X→EN reverse views (sv-en, de-en, it-en, fr-en)
      const headField = current === 'sv-en' ? d.sv
        : current === 'de-en' ? d.de
        : current === 'it-en' ? d.it
        : d.fr;
      const headWord = asArr(headField);
      const altEn = en.length > 1
        ? ` <span class="alt">· ${esc(en.slice(1).join(', '))}</span>`
        : '';
      return `<div class="row${scoreOf(d) === 0 ? ' match-exact' : ''}">
        <div class="fi">${esc(headWord[0] || '')}</div>
        <span></span>
        <div class="en">${esc(en[0] || '')}${altEn}</div>
        <div class="fr"></div>
        <div class="de"></div>
        <div class="sv"></div>
        <div class="it"></div>
      </div>`;
    }
  }).join('');
  if (filtered.length > 500) {
    list.innerHTML += `<div class="empty">…and ${(filtered.length - 500).toLocaleString()} more — refine search.</div>`;
  }
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    current = t.dataset.tab;
    render();
  };
});
document.getElementById('q').addEventListener('input', render);
document.getElementById('q').focus();
load();
</script>
</body>
</html>
